// ── DYNAMIC CODE POOL ──
var CODE_HASHES=FB_HASHES;
var CODE_LIST=FB_CODES;
var CODES_LOADED=false;

async function loadCodes(){
try{
var resp=await fetch('codes.json?'+Date.now());
if(!resp.ok)throw new Error('HTTP '+resp.status);
var data=await resp.json();
if(data.codes&&data.hashes&&data.codes.length===data.hashes.length&&data.codes.length>0){
CODE_HASHES=data.hashes;
CODE_LIST=data.codes;
CODES_LOADED=true;
return true;
}
}catch(e){console.warn('codes.json 加载失败，使用内置验证码:',e.message);}
CODE_HASHES=FB_HASHES;
CODE_LIST=FB_CODES;
return false;
}

async function shorthash(str){
var e=new TextEncoder().encode(str);
var h=await crypto.subtle.digest('SHA-256',e);
return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join('').slice(0,16);
}

function getDeviceId(){
var k='_aes_did',id=localStorage.getItem(k);
if(!id){id='dev-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem(k,id)}
return id;
}

function formatCode(){
var inp=document.getElementById('codeInput'),v=inp.value.replace(/[^A-Z0-9]/g,'').toUpperCase();
if(v.length>4)v=v.slice(0,4)+'-'+v.slice(4,8);
inp.value=v;
}

var VALIDATED=false,VALIDATED_HASH='';

async function validateCode(){
var raw=document.getElementById('codeInput').value.trim();
if(raw.length<9){document.getElementById('codeError').textContent='请输入完整验证码';return}
var code=raw.replace('-','');
var hash=await shorthash(code);
var idx=CODE_HASHES.indexOf(hash);
if(idx<0){document.getElementById('codeError').textContent='验证码无效';return}

var did=getDeviceId();
var usedKey='_aes_u_'+hash;
var used=localStorage.getItem(usedKey);
var now=Date.now();
if(used&&!CODES_LOADED){
try{var d=JSON.parse(used);}catch(e){d={};}
if(d.device&&d.device!==did){document.getElementById('codeError').textContent='此验证码已绑定其他设备';return}
if(now-d.time>30*60*1000){document.getElementById('codeError').textContent='验证码已过期（30分钟有效）';return}
}
if(!used){localStorage.setItem(usedKey,JSON.stringify({device:did,time:now}));}

VALIDATED=true;VALIDATED_HASH=hash;
startQuiz();
}
